name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JS syntax
        run: |
          for f in web/rt/rt.js web/rt/sr.js web/player_worker.js extension/*.js extension/src/*.js                    extension/src/ui/*.js extension/rt/*.js extension/engine/adapters.js extension/engine/flyhigh_web.js; do
            node --check "$f"
          done

      - name: Extension unit and acceptance contracts
        run: node --test tools/*.test.mjs

      - name: Python syntax
        run: python -m py_compile tools/*.py

      - name: Extension package smoke
        shell: pwsh
        run: |
          ./tools/build_extension.ps1
          git diff --exit-code -- extension/rt extension/assets

      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check (wgpu host only - the TensorRT crate needs CUDA)
        run: cargo check -p rife-wgpu
