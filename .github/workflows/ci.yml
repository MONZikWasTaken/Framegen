name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JS syntax
        run: |
          node --check web/rt/rt.js
          node --check web/rt/sr.js
          node --check extension/cadence.js
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/options.js
          node --check extension/popup.js
          node --check extension/profile-store.js
          node --check extension/rt/rt.js
          node --check extension/rt/sr.js
          node --check web/player_worker.js
          node --check tools/run_display_hz_check.mjs

      - name: Extension unit and acceptance contracts
        run: node --test tools/*.test.mjs

      - name: Python syntax
        run: python -m py_compile tools/*.py

      - name: Extension package smoke
        shell: pwsh
        run: |
          ./tools/build_extension.ps1
          git diff --exit-code -- extension/rt extension/assets

      - name: npm package smoke
        working-directory: packages/rt
        run: npm pack --dry-run

      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check (wgpu host only - the TensorRT crate needs CUDA)
        run: cargo check -p rife-wgpu
