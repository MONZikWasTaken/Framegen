<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Framegen</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="icons/icon32.png" width="20" height="20" alt="">
      <h1>Framegen</h1>
      <span id="ver" class="version"></span>
    </div>
    <button id="tabHelp" class="button button-quiet view-button" type="button" aria-controls="help" aria-expanded="false">
      <span id="openHelp" data-i18n="help">Help</span>
      <span id="closeHelp" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m11 5-7 7 7 7M4 12h16"/>
        </svg>
        <span data-i18n="status">Status</span>
      </span>
    </button>
  </header>

  <main>
    <div id="status">
      <section id="playerStatus" class="player-status" data-state="idle" data-i18n-aria-label="status">
        <h2 id="state" aria-live="polite">Checking this tab…</h2>
        <p id="stateHint" class="state-hint" hidden></p>

        <dl id="details" class="details" hidden>
          <div><dt data-i18n="popup_gpu_label">Graphics card</dt><dd id="gpu"></dd></div>
          <div><dt>WebGPU</dt><dd data-i18n="popup_webgpu_available">Available</dd></div>
        </dl>
      </section>
      <div id="gpuNotice" class="gpu-notice" hidden>
        <p data-i18n="popup_integrated">Integrated GPU in use.</p>
        <button id="showGpuHelp" class="text-button" type="button" data-i18n="popup_switch_gpu">How to switch GPUs</button>
      </div>
    </div>

    <section id="help" class="help" data-i18n-aria-label="help" hidden>
      <details name="help-topic" open>
        <summary data-i18n="how_to_use">How to use</summary>
        <p data-i18n="how_to_use_hint"></p>
      </details>
      <details name="help-topic">
        <summary data-i18n="no_adapter_title">GPU adapter and startup issues</summary>
        <p data-i18n="webgpu_help_intro"></p>
        <ol>
          <li><span data-i18n="open">Open</span> <b>chrome://settings/system</b></li>
          <li data-i18n="chrome_acceleration"></li>
          <li data-i18n="restart_browser"></li>
        </ol>
        <p data-i18n="driver_update"></p>
      </details>
      <details name="help-topic" id="gpuHelp">
        <summary data-i18n="laptop_gpus">Two GPUs (laptop)</summary>
        <p data-i18n="laptop_gpus_hint"></p>
        <ol>
          <li data-i18n="windows_graphics"></li>
          <li data-i18n="windows_high_performance"></li>
          <li data-i18n="restart_it"></li>
        </ol>
        <p data-i18n="check_gpu"></p>
      </details>
      <details name="help-topic">
        <summary data-i18n="requirements">Requirements</summary>
        <p data-i18n="requirements_hint"></p>
      </details>
      <details name="help-topic">
        <summary data-i18n="limitations">Limitations</summary>
        <p data-i18n="limitations_hint"></p>
      </details>
    </section>

    <div class="actions">
      <div class="popup-language">
        <label for="interfaceLanguage" data-i18n="language">Interface language</label>
        <span class="select-field"><select id="interfaceLanguage"></select></span>
      </div>
      <p id="languageError" class="language-error" role="status" hidden></p>
      <button id="fullSettings" class="button button-quiet full-settings" type="button">
        <span data-i18n="advanced_settings">Advanced settings</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 17 17 7M7.5 7H17v9.5"/>
        </svg>
      </button>
    </div>
  </main>

  <footer class="footer">
    <a href="https://github.com/MONZikWasTaken/Framegen" target="_blank" rel="noopener noreferrer">GitHub</a>
    <a href="https://github.com/getflyhigh/flyhigh-engine" target="_blank" rel="noopener noreferrer" data-i18n="flyhigh_engine_link">FlyHigh engine</a>
    <span class="license">MIT</span>
  </footer>
</body>
</html>
